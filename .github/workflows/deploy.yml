# Deploys the site whenever `production` changes: GitHub connects to the
# droplet with a key that can do one thing only — run scripts/deploy.sh
# (the key's forced command in /root/.ssh/authorized_keys). That script pulls,
# builds, waits for health, runs the smoke test and rolls back on failure, so a
# red run here means the previous version is still the one serving.
#
# The droplet's SSH port is closed to the internet, so the runner first joins
# the Tailscale network as a short-lived tag:ci machine and connects over it.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_TAILNET_HOST (the server's
# 100.x Tailscale IP), DEPLOY_TAILNET_KNOWN_HOSTS (its host keys under that IP),
# TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET (a Tailscale OAuth client with the
# auth_keys scope and tag:ci).
name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

# one deploy at a time; a newer push waits for the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The machine is ephemeral: it leaves the tailnet when the job ends.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: '1.104.2'
          ping: ${{ secrets.DEPLOY_TAILNET_HOST }}

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_TAILNET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server ignores whatever command is sent and runs the deploy script.
      - name: Deploy on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_TAILNET_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              "root@$DEPLOY_HOST" deploy

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
